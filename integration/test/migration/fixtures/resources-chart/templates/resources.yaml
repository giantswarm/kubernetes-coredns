apiVersion: v1
kind: Service
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: coredns
    kind: legacy
spec:
  ports:
  - port: 10301
  selector:
    k8s-app: coredns
    kind: legacy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: coredns
    kind: legacy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: coredns
    kind: legacy
data:
  enable-vts-status: "true"
---
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  labels:
    k8s-app: coredns
    kind: legacy
spec:
  replicas: 0
  template:
    metadata:
      labels:
        k8s-app: coredns
    spec:
      containers:
      - name: coredns
        image: quay.io/giantswarm/coredns:v1.3.1
        resources:
          requests:
            cpu: 50m
            memory: 75Mi
      serviceAccountName: coredns
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1beta1
metadata:
  name: coredns
  labels:
    k8s-app: coredns
    kind: legacy
subjects:
  - kind: ServiceAccount
    name: coredns
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: coredns
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns
  labels:
    k8s-app: coredns
    kind: legacy
