{{- if .Values.global.migration.job.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": "hook-succeeded"
  labels:
    app: {{ .Values.name }}
    giantswarm.io/service-type: "managed"
data:
  config.yaml: |
    service:
      adopt:
        chart:
          path: "/var/run/{{ .Values.name }}/chart"
          releaseName: "coredns"
          namespace: "kube-system"
      kubernetes:
        address: ''
        inCluster: true
        tls:
          caFile: ''
          crtFile: ''
          keyFile: ''
  resources.json: |
    [
        {
            "kind": "Deployment",
            "name": "coredns",
            "namespace": "kube-system",
            "matchLabels": {
                "k8s-app": "coredns"
            },
            "excludeLabels": {
                "giantswarm.io/service-type": "managed"
            }
        },
        {
            "kind": "ConfigMap",
            "name": "coredns,
            "namespace": "kube-system",
            "matchLabels": {
                "k8s-addon": "coredns.addons.k8s.io"
            },
            "excludeLabels": {
                "giantswarm.io/service-type": "managed"
            }
        },
        {
            "kind": "ClusterRoleBinding",
            "name": "coredns",
            "namespace": "kube-system",
            "matchLabels": {
                "k8s-app": "coredns"
            },
            "excludeLabels": {
                "giantswarm.io/service-type": "managed"
            }
        },
        {
            "kind": "ClusterRole",
            "name": "coredns",
            "namespace": "kube-system",
            "matchLabels": {
                "k8s-app": "coredns"
            },
            "excludeLabels": {
                "giantswarm.io/service-type": "managed"
            }
        },
        {
            "kind": "ServiceAccount",
            "name": "coredns",
            "namespace": "kube-system",
            "matchLabels": {
                "k8s-app": "coredns"
            },
            "excludeLabels": {
                "giantswarm.io/service-type": "managed"
            }
        }
    ]
{{- end }}
