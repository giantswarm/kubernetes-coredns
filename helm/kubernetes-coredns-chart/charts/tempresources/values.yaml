# Default values for tempresources chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: coredns-tempresources
namespace: kube-system

image:
  registry: quay.io
  repository: giantswarm/k8s-migrator
  tag: latest

cnr:
  address: "https://quay.io"
  organization: "giantswarm"

create:
  chart:
    chartName: "kubernetes-coredns-chart"
    channelName: "0-2-stable"
    namespace: "kube-system"
    releaseName: "temp-coredns"

controller:
  name: "temp-coredns"

  configmap:
    name: "temp-coredns"

  role:
    name: "temp-coredns-role"

  service:
    enabled: false

helm:
  tillerNamespace: "giantswarm"

resources:
  limits:
    cpu: 50m
    memory: 75Mi
  requests:
    cpu: 50m
    memory: 75Mi
