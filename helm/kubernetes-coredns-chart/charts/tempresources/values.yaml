# Default values for tempresources chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: coredns-tempresources
namespace: kube-system

image:
  registry: quay.io
  repository: giantswarm/k8s-migrator
  tag: latest

cnr:
  address: "https://quay.io"
  organization: "giantswarm"

create:
  name: "temp-coredns"
  cluster:
    kubernetes:
      DNS:
        IP: 10.96.0.11
  chart:
    chartName: "kubernetes-coredns-chart"
    channelName: "0-1-stable"
    namespace: "kube-system"
    releaseName: "temp-coredns"

helm:
  tillerNamespace: "giantswarm"

resources:
  limits:
    cpu: 50m
    memory: 75Mi
  requests:
    cpu: 50m
    memory: 75Mi
