apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    k8s-app: {{ .Values.name }}
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: "CoreDNS"
spec:
  selector:
    k8s-app: {{ .Values.name }}
  clusterIP: {{ .Values.cluster.kubernetes.DNS.IP }}
  ports:
  - name: {{ .Values.ports.udp.name }}
    port: {{ .Values.ports.udp.port }}
    protocol: UDP
  - name: {{ .Values.ports.tcp.name }}
    port: {{ .Values.ports.tcp.port }}
    protocol: TCP
