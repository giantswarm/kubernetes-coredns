kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.name }}-allow-from-all-namespaces
spec:
  podSelector:
    matchLabels:
      k8s-app: {{ .Values.name }}
  ingress:
  - ports:
    - port: {{ .Values.ports.dns.targetPort }}
      protocol: UDP
    - port: {{ .Values.ports.dns.targetPort }}
      protocol: TCP
    - port: {{ .Values.ports.prometheus }}
      protocol: TCP
  - from:
    - namespaceSelector: {}
---
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.name }}-deny-access-to-metrics
spec:
  podSelector:
    matchLabels:
      k8s-app: {{ .Values.name }}
  ingress: []
