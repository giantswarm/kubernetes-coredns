# Default values for coredns-chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

name: coredns
namespace: kube-system

replicas: 2

image:
  registry: quay.io
  repository: giantswarm/coredns
  tag: 1.1.1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

ports:
  dns:
    name: dns
    port: 53
  prometheus: 9153

# TODO: Reorganize and rename: e.g. split ClusterIpRange value, to reuse kubernetes.dns.IP?
# Original keys from k8scloudconfig: {{.Cluster.Kubernetes.Domain}} {{.Cluster.Kubernetes.API.ClusterIPRange}} {{.Cluster.Calico.Subnet}}/{{.Cluster.Calico.CIDR}}
cluster:
  calico:
    subnet: 192.168.0.0
    CIDR: 16
  kubernetes:
    DNS:
      IP: 172.31.0.0
    domain: cluster.local
    API:
      clusterIPRange: 172.31.0.0/16
